# Copy to config.toml and edit. Two mutually exclusive image_source modes:

# --- Mode 1: direct file (a path continuously overwritten with the latest frame) ---
[mlclouddetect]
image_source = "file"
allsky_file = "/home/pi/allsky/tmp/image.jpg"
model_path = "keras_model.h5"
labels_path = "labels.txt"
cloudy_label = "Cloudy"
pending_count = 3

