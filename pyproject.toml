[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "requirement(tc_id): RTM Test Case ID, e.g. TC-ARCH-010",
    "priority(level): Requirement priority — MVP, P2, or P3",
    "soak: Requires extended runtime (hours); excluded from normal CI runs",
    "hardware: Requires physical INDI/Alpaca hardware to be reachable on the LAN",
    "integration: Requires a running external service (INDI server, PHD2, solver, etc.)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py311"   # matches requires-python below; lets UP suggest PEP 604/585 syntax safely
line-length = 120          # close to the codebase's actual p99 (269 lines currently exceed 120, none by much)

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # pyflakes/pycodestyle core (ruff's own baseline)
    "W",                     # pycodestyle warnings
    "UP",                    # pyupgrade — modernize to what py311 actually supports (154 findings: Optional/List/Dict-style hints)
    "B",                     # flake8-bugbear — real-bug patterns (mutable defaults, loop-var closures, etc.); not previously measured, worth the first-run noise
    "SIM",                   # flake8-simplify — genuine simplifications found (collapsible-if, needless-bool, ...)
    "C4",                    # flake8-comprehensions — cheap comprehension/collection cleanups
    "RUF",                   # ruff-native rules — unsorted __all__, mutable class defaults, stale `# noqa`, ...
    "DTZ",                   # flake8-datetimez — tz-naive datetime.now()/utcnow() (71 findings); a real correctness risk
                              # for an app that schedules observations by UTC, not just a style nit
    "LOG",                   # flake8-logging — root-logger calls (232 findings, almost all in commands/ and
                              # library/core/auto_calibration.py) bypass this app's per-module logging entirely
    "G",                     # flake8-logging-format — companion to LOG (logging.exception vs exc_info, etc.)
    "ASYNC",                 # flake8-async — blocking calls inside async def; this app's whole concurrency model
                              # (CLAUDE.md's qasync bridge) depends on async functions never blocking the UI loop
    "TRY",                   # tryceratops — exception-handling idioms (vanilla Exception, verbose raise/log)
    "PIE",                   # flake8-pie — misc cleanups (unnecessary placeholders, redundant startswith calls)
    "FURB",                  # refurb — modern-idiom suggestions
    "S",                     # flake8-bandit — fast, editor-time version of the same checks `bandit` runs deeper;
                              # already caught real findings here (weak MD5/SHA1, shell=True, paramiko AutoAddPolicy)
]
ignore = [
    "TRY003",   # "avoid long messages outside the exception class" — this project raises with contextual
                # f-strings throughout (see galileo/exceptions.py callers); not worth a mass refactor to comply
    "TRY300", "TRY301",  # "move the success return into an else:" / "extract raise into its own function" —
                # pure control-flow restructuring with no behavior change; ~140 combined hits, not worth the diff
    "G004",     # f-strings in logging calls — this is the codebase's established logging style (~1,000 call
                # sites); the lazy %-formatting alternative is a real project-wide style change, not a fix
    "RUF001", "RUF002", "RUF003",  # "ambiguous unicode character" — this app deliberately prints real
                # arcsecond/degree symbols (″, °) and em dashes in user-facing strings; not a typo to flag
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # `assert` is the normal pytest idiom, not a security smell, in test files
    "S105", "S106", "S107",  # fixture credentials/tokens are fake test doubles, not hardcoded secrets
]

[project]
name = "galileo"
version = "0.1.0"
description = "Cross-Platform Astrophotography Imaging Suite"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    # Core scientific stack
    "numpy>=1.24",
    "astropy>=5.0",
    # Device protocols
    # INDI needs no extra package: galileo.adapters.indi_client is a native Python INDI-protocol client
    # (pyindi-client cannot be built on Windows because libindi has no Windows port).
    # "alpyca>=0.1",          # optional: Alpaca device support
    "zeroconf>=0.130.0",      # resolves .local mDNS hostnames (e.g. seestar.local) on Windows
    # Image processing
    "sep>=1.2",               # Source Extractor Python (star detection / HFR)
    "Pillow>=10.0",           # FITS-cutout-to-JPEG thumbnail conversion (SKY-080, ported from Obsy)
    # Image registration / photometry
    "astroalign>=2.4",
    "photutils>=1.5",
    "astroquery>=0.4.6",
    "pandas>=1.5",
    # Persistence
    "peewee>=3.17",
    "peewee-migrate>=1.12",
    # Network adapters
    "requests>=2.28",
    "paramiko>=3.0",          # SFTP
    "keyring>=24.0",          # OS credential store (NFR-SEC-010) — was already transitively pulled in by astroquery
    # Library (AstroFiler): master frames, cloud sync, smart-telescope shares, XISF import, statistics
    "scipy>=1.7",
    "matplotlib>=3.3",
    "reproject>=0.12",        # WCS-based frame alignment when stacking masters
    "lz4>=3.0",               # lz4-compressed XISF blocks
    "pysmb>=1.2",             # SMB/CIFS shares on smart telescopes
    "google-cloud-storage>=2.0",  # Google Cloud Storage sync (Library > Cloud)
    # UI
    "PySide6>=6.5",
    # Async
    "qasync>=0.27",
]

[project.scripts]
galileo = "galileo.app:main"
galileo-auto-calibration = "galileo.commands.auto_calibration:main"
galileo-cloud-sync = "galileo.commands.cloud_sync:main"
galileo-create-sessions = "galileo.commands.create_sessions:main"
galileo-download = "galileo.commands.download:main"
galileo-link-sessions = "galileo.commands.link_sessions:main"
galileo-load-repo = "galileo.commands.load_repo:main"
galileo-photometry = "galileo.commands.photometry:main"
galileo-register-existing = "galileo.commands.register_existing:main"
galileo-reset-calibration-test-state = "galileo.commands.reset_calibration_test_state:main"
galileo-stack = "galileo.commands.stack:main"
galileo-sync-repo = "galileo.commands.sync_repo:main"
galileo-variable-star-photometry = "galileo.commands.variable_star_photometry:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "numpy",
    "astropy",
]
dev = [
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["galileo*"]
