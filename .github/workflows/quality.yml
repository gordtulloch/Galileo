name: Code quality and tests

# Everything the code review ("Code Review.md") ran by hand, on every push to main and every pull request.
#
# static-analysis
#   ruff        BLOCKING, for the Python files the change touches (the existing backlog does not stop unrelated work)
#   bandit      BLOCKING for High severity; Medium/Low are listed but informational
#   pip-audit   BLOCKING: the dependency set has no known vulnerabilities
#   radon       BLOCKING if any function reaches complexity rank F (> 40); the ranking is printed for E and worse
#   vulture     informational (dead-code candidates at >= 80 % confidence; unused parameters are expected)
#   mypy        informational until the Qt "Optional" backlog is cleared
# tests
#   the pytest suite that release.yml runs on tags, including the regression tests added for the review
#   (TC-LIB-010 DatabaseError, TC-LIB-060 session calibration, TC-LIB-090 checkout/context menu, TC-LIB-100 merge)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-analysis:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ruff needs the merge base to find the changed files
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Galileo with dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev]"

      - name: ruff (changed Python files only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          files=$(git diff --name-only --diff-filter=d "$base"...HEAD -- '*.py' 2>/dev/null || true)
          if [ -z "$files" ]; then echo "No Python files changed"; exit 0; fi
          echo "$files" | xargs ruff check

      - name: bandit (High severity blocks)
        run: bandit -r galileo -lll -q

      - name: bandit (Medium and Low, informational)
        continue-on-error: true
        run: bandit -r galileo -q

      - name: pip-audit
        run: pip-audit

      - name: radon (no function above complexity rank E)
        run: |
          radon cc galileo -nE -s
          if [ -n "$(radon cc galileo -nF -s)" ]; then
            echo "::error::A function reached cyclomatic complexity rank F (> 40); split it up."
            radon cc galileo -nF -s
            exit 1
          fi

      - name: vulture (informational)
        continue-on-error: true
        run: vulture galileo --min-confidence 80

      - name: mypy (informational)
        continue-on-error: true
        run: mypy galileo

  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt runtime libraries
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get -o Acquire::Retries=3 update
          sudo -E apt-get -o Acquire::Retries=3 install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libdbus-1-3
      - name: Install Galileo with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test suite (no soak, hardware, external-service or machine-speed perf tests)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -m "not soak and not hardware and not integration and not perf" -q
